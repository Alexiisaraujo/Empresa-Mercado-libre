.hero h1{font-family:var(--fd);font-size:clamp(32px,4.6vw,58px);font-weight:700;max-width:20ch;letter-spacing:-.02em}

.kpis{position:relative;display:grid;grid-template-columns:repeat(5,1fr);background:var(--navy2);border-top:1px solid #23405a}

.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}

.ic{width:40px;height:40px;border-radius:11px;background:var(--y);color:#111;display:grid;place-items:center;font-weight:800;margin-bottom:14px;font-size:17px}
.card .big{font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--tx);margin:2px 0 6px}
.card .more{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--blue)}

sup.c{color:var(--blue);cursor:pointer;font-weight:700;font-size:11px;margin-left:1px}sup.c:hover{text-decoration:underline}
.scroller{overflow-x:auto;padding-bottom:12px;scrollbar-width:thin}
.tl{display:flex;gap:0;min-width:max-content;position:relative;padding-top:38px}
.tl:before{content:"";position:absolute;left:0;right:0;top:26px;height:3px;background:var(--y)}
.ty{width:150px;flex:none;padding-right:14px;cursor:pointer;position:relative;background:none;border:0;text-align:left;font:inherit;color:inherit}
.ty:before{content:"";position:absolute;top:-19px;left:0;width:15px;height:15px;border-radius:50%;background:var(--card);border:3px solid var(--y);transition:transform .2s}
.ty:hover:before{transform:scale(1.35);background:var(--y)}
.ty b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}.ty span{font-size:13px;color:var(--mu);display:block;line-height:1.35}
.dk .ty:before{background:var(--navy)}.dk .ty span{color:#a9bacb}
.modal{position:fixed;inset:0;background:rgba(6,12,20,.66);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.on{display:flex;animation:fd .2s}
@keyframes fd{from{opacity:0}to{opacity:1}}
.mb{background:var(--card);color:var(--tx);border-radius:18px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:30px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.4)}

.form label{font-size:12px;font-weight:700;color:var(--mu);display:block}
.form input{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:9px;font:inherit;background:var(--card);color:var(--tx);margin-top:4px}
.sc{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}
.sc .card .big{font-size:22px}
.country{padding:16px 10px;border-radius:12px;background:var(--card);border:1px solid var(--bd);cursor:pointer;text-align:center;font-weight:700;font-size:14px;transition:.2s}
.country:hover,.country.on{background:var(--y);color:#111;border-color:var(--y)}
.pane{background:var(--navy);color:#e8eef5;border-radius:var(--r);padding:22px;margin-top:16px}
.res{max-height:70vh;overflow:auto}.res h4{font-size:12px;color:var(--mu);margin:16px 0 6px}
.res a{display:block;padding:8px 10px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:14px;cursor:pointer}.res a:hover{background:var(--bg)}
.res a small{color:var(--mu);display:block}
.foot{padding:40px 56px;font-size:13px;color:var(--mu)}

 let cash=cap,minC=cap,be=null,rev12=0,cost12=0,b=comp,rows=[];
 for(let t=1;t<=36;t++){const nb=comp*Math.pow(1+cg,t),nw=nb-b;b=nb;const ord=nb*fr/12,gmv=ord*tick,rev=gmv*com*mar,logc=ord*lg,ac=Math.max(nw,0)*cac,res=rev-logc-ac-fix;cash+=res;minC=Math.min(minC,cash);if(be===null&&res>0)be=t;if(t<=12){rev12+=rev;cost12+=logc+ac+fix}rows.push(cash)}
 return{rev12,cost12,mg:rev12?(rev12-cost12)/rev12:0,be,need:Math.max(cap-minC,0),end:cash,rows,gmvSel:comp*fr*tick/Math.max(vend,1)}}

$$("[data-c]").forEach(el=>{const to=parseFloat(el.dataset.c),d=el.dataset.d?1:0;if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const t0=performance.now();(function f(t){const k=Math.min((t-t0)/1200,1),v=to*(1-Math.pow(1-k,3));el.textContent=d?v.toFixed(1).replace(".",","):Math.round(v).toString();if(k<1)requestAnimationFrame(f)})(t0)});

/* ============ BUSCADOR ============ */
const IDX=[];
TL.forEach((t,i)=>IDX.push({c:"Historia",t:t.y+" — "+t.t,x:JSON.stringify(t),f:()=>$$(".ty")[i].click()}));
PPL.forEach((p,i)=>IDX.push({c:"Personas",t:p.n,x:p.r+p.b.join(" "),f:()=>$$("[data-p]")[i].click()}));
STRAT.forEach((s,i)=>IDX.push({c:"Estrategias",t:s[0],x:s.join(" "),f:()=>location.hash="#estrategias"}));
[["Ingresos y utilidad","finanzas"],["Balance","balance"],["Simulador","simulador"],["Salida a bolsa (IPO)","financiacion"],["Mercado Pago","pago"],["Mercado Envíos","envios"],["Mercado Crédito","credito"],["Mercado Ads","ads"],["Brasil","expansion"],["Financiación","financiacion"],["eBay","competencia"]].forEach(([t,h])=>IDX.push({c:/Ingresos|Balance|IPO|Financ/.test(t)?"Finanzas":"Productos",t,x:t,f:()=>location.hash="#"+h}));
Object.entries(SRC).forEach(([n,s])=>IDX.push({c:"Fuentes",t:`[${n}] ${s.t}`,x:s.o+" "+s.d,f:()=>{mb.innerHTML=`<button class="mx">×</button>`+srcHtml(n);modal.classList.add("on")}}));
$("#q").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();if(q.length<2)return;
 const r=IDX.filter(i=>(i.t+" "+i.x).toLowerCase().includes(q)),G={};r.forEach(i=>(G[i.c]=G[i.c]||[]).push(i));
 window.__r=r;let h=`<h3>Resultados para «${e.target.value}»</h3><div class="res">`;
 if(!r.length)h+="<p>Sin resultados. Prueba con otra palabra.</p>";
 ["Historia","Personas","Finanzas","Productos","Estrategias","Fuentes"].forEach(c=>{if(G[c])h+=`<h4>${c.toUpperCase()}</h4>`+G[c].slice(0,8).map(i=>`<a data-ri="${r.indexOf(i)}">${i.t}</a>`).join("")});
 mb.innerHTML=`<button class="mx">×</button>`+h+"</div>";modal.classList.add("on");$("#q").focus()});
mb.addEventListener("click",e=>{const a=e.target.closest("[data-ri]");if(a){const it=window.__r[a.dataset.ri];modal.classList.remove("on");setTimeout(()=>it.f(),50)}});
</script>
</body>
